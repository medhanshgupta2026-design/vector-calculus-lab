<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Calculus Engine - Premium Dashboard</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: rgba(15, 23, 42, 0.65);
            --bg-nested: #020617;
            --border-glow: rgba(51, 65, 85, 0.35);
            --accent-emerald: #10b981;
            --accent-cyan: #06b6d4;
            --accent-violet: #8b5cf6;
            --accent-danger: #f43f5e;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-base); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-glow); padding: 0 30px; height: 65px; display: flex; justify-content: space-between; align-items: center; z-index: 50; flex-shrink: 0; }
        .logo-section { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
        .logo-section span { color: var(--accent-cyan); }
        .tabs { display: flex; gap: 8px; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 20px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 6px; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active { color: var(--text-primary); background: var(--accent-violet); box-shadow: 0 0 16px rgba(139, 92, 246, 0.4); }
        .drawer-trigger { background: transparent; border: 1px solid var(--border-glow); color: var(--accent-emerald); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
        .drawer-trigger:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--accent-emerald); }

        .main-wrapper { flex: 1; display: flex; position: relative; overflow: hidden; width: 100%; height: calc(100vh - 65px); }
        .view-pane { flex: 1; height: 100%; display: none; padding: 30px; overflow-y: auto; width: 100%; }
        .view-pane.active { display: grid; }

        .manual-grid { grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .glass-card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glow); border-radius: 14px; padding: 26px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); height: fit-content; }
        .card-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-glow); padding-bottom: 14px; }
        .formula-box { background: var(--bg-nested); padding: 14px; border-radius: 8px; border-left: 4px solid var(--accent-cyan); font-family: 'Fira Code', monospace; color: var(--accent-cyan); font-size: 15px; margin: 5px 0; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.75px; }
        p { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

        .code-container { font-family: 'Fira Code', monospace; background: var(--bg-nested); padding: 20px; border-radius: 8px; color: #34d399; font-size: 13px; overflow-x: auto; white-space: pre; border: 1px solid var(--border-glow); line-height: 1.6; }
        .line-explanation { display: flex; flex-direction: column; gap: 14px; margin-top: 5px; }
        .exp-item { display: flex; gap: 14px; font-size: 13px; border-bottom: 1px dashed var(--border-glow); padding-bottom: 12px; align-items: flex-start; }
        .exp-item strong { color: var(--text-primary); font-family: 'Fira Code', monospace; min-width: 120px; }

        .arena-grid { grid-template-columns: 340px 1fr; gap: 30px; height: 100%; max-width: 1600px; margin: 0 auto; width: 100%; }
        .sidebar-controls { display: flex; flex-direction: column; gap: 24px; height: 100%; overflow-y: auto; }
        .slider-wrap { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; accent-color: var(--accent-violet); background: #1e293b; height: 6px; border-radius: 4px; outline: none; cursor: pointer; }
        .slider-val { font-family: 'Fira Code', monospace; font-size: 13px; min-width: 40px; color: var(--accent-cyan); text-align: right; }
        
        .btn-toggle-row { display: flex; gap: 10px; }
        .toggle-btn { flex: 1; background: #1e293b; border: 1px solid var(--border-glow); color: var(--text-muted); padding: 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s ease; }
        .toggle-btn.active { background: rgba(6, 182, 212, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .preset-btn { width: 100%; background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.25); color: #c084fc; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
        .preset-btn:hover { background: var(--accent-violet); color: var(--text-primary); }

        .challenge-box { background: rgba(244, 63, 94, 0.04); border: 1px solid rgba(244, 63, 94, 0.2); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .challenge-box strong { color: var(--accent-danger); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .system-status { background: var(--bg-nested); padding: 14px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 0.75px; border: 1px solid var(--border-glow); text-transform: uppercase; }
        .status-stable { color: var(--accent-emerald); }
        .status-warning { color: var(--accent-danger); animation: pulseAlert 0.8s infinite alternate; }
        @keyframes pulseAlert { from { opacity: 0.5; } to { opacity: 1; } }

        .canvas-area { display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; }
        .metrics-row { display: flex; gap: 20px; flex-shrink: 0; }
        .metric-card { flex: 1; background: var(--bg-nested); border: 1px solid var(--border-glow); border-radius: 10px; padding: 14px 22px; display: flex; flex-direction: column; gap: 4px; }
        .metric-num { font-family: 'Fira Code', monospace; font-size: 24px; font-weight: 700; color: var(--text-primary); }
        #canvasContainer { flex: 1; background: #010409; border-radius: 14px; border: 2px solid var(--border-glow); position: relative; overflow: hidden; min-height: 380px; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .notebook-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-glow); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px; margin-top: 5px; flex-shrink: 0; }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glow); padding-bottom: 12px; }
        .run-btn { background: var(--accent-emerald); color: var(--bg-nested); border: none; padding: 8px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .input-row { display: flex; gap: 12px; align-items: center; background: var(--bg-nested); border: 1px solid var(--border-glow); padding: 12px 16px; border-radius: 8px; }
        .prompt-symbol { font-family: 'Fira Code', monospace; font-weight: 700; color: var(--accent-cyan); font-size: 16px; }
        .console-input { background: transparent; border: none; outline: none; color: var(--text-primary); font-family: 'Fira Code', monospace; font-size: 14px; flex: 1; }
        .terminal-output { background: #020617; border: 1px solid var(--border-glow); padding: 16px; border-radius: 8px; min-height: 90px; font-family: 'Fira Code', monospace; font-size: 13px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }

        .backend-drawer { position: absolute; right: -420px; top: 0; width: 420px; height: 100%; background: #0a0e1a; border-left: 2px solid var(--border-glow); z-index: 100; transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; padding: 30px; gap: 24px; box-shadow: -15px 0 40px rgba(0,0,0,0.6); }
        .backend-drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glow); padding-bottom: 16px; }
        .close-drawer { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; }
        
        .flow-timeline { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
        .flow-step { display: flex; gap: 16px; position: relative; opacity: 0.35; transition: all 0.4s ease; }
        .flow-step.active { opacity: 1; }
        .flow-step:not(:last-child)::after { content: ''; position: absolute; left: 13px; top: 28px; bottom: -20px; width: 2px; background: var(--border-glow); }
        .flow-step.active:not(:last-child)::after { background: var(--accent-cyan); }
